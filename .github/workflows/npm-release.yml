name: npm release preparation
# Isolated export template. Does not run in the private repository.
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed workflow SHA (40 lowercase hex)
        required: true
        type: string
      release_source_sha:
        description: Original published package source SHA (recovery only)
        required: false
        type: string
      expected_version:
        description: Frozen expected npm version
        required: true
        type: string
      inventory_sha256:
        description: SHA-256 of reviewed external candidate_json exact UTF-8 bytes
        required: true
        type: string
      candidate_json:
        description: Reviewed frozen candidate JSON (external to the source commit)
        required: true
        type: string
      operation:
        description: Reviewed immutable release operation
        required: true
        type: choice
        options: [prepare, candidate, promote, recovery-promote]
permissions:
  contents: read
  id-token: write
concurrency:
  group: npm-production
  cancel-in-progress: false
jobs:
  prepare:
    if: inputs.operation == 'prepare' && github.repository == 'winhok/SceneWireJS' && github.sha == inputs.expected_sha
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: npm-production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Pin release tools
        run: |
          npm install --global npm@12.2.0 corepack@0.36.0
          corepack enable
      - name: Frozen install, build and package audit
        run: |
          pnpm install --frozen-lockfile
          pnpm build:cli
          pnpm package:check
          pnpm package:pack
      - name: Verify frozen candidate and capture exact canonical payload locally
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          INVENTORY_SHA256: ${{ inputs.inventory_sha256 }}
          CANDIDATE_JSON: ${{ inputs.candidate_json }}
        run: |
          CANDIDATE_FILE="$RUNNER_TEMP/scenewire-release-candidate.json"
          node scripts/release/dispatch-candidate.mjs "$CANDIDATE_FILE" "$EXPECTED_SHA" "$EXPECTED_VERSION" "$INVENTORY_SHA256"
          NPM_CLI="$(npm root --global)/npm/bin/npm-cli.js"
          node scripts/release/prepare.mjs prepare "$CANDIDATE_FILE" "$EXPECTED_SHA" "$EXPECTED_VERSION" "$INVENTORY_SHA256" .build/npm "$NPM_CLI" > release-preparation.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-preparation
          path: release-preparation.json
          if-no-files-found: error
  candidate:
    # Activation requires an owner-authorized reviewed source commit; vars alone cannot enable it.
    if: inputs.operation == 'candidate' && github.repository == 'winhok/SceneWireJS' && github.sha == inputs.expected_sha
    runs-on: ubuntu-24.04
    environment: npm-production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: |
          npm install --global npm@12.2.0 corepack@0.36.0
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build:cli
          pnpm package:check
          pnpm package:pack
      - name: Exact canonical OIDC candidate submit and complete registry readback
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          INVENTORY_SHA256: ${{ inputs.inventory_sha256 }}
          CANDIDATE_JSON: ${{ inputs.candidate_json }}
        run: |
          CANDIDATE_FILE="$RUNNER_TEMP/scenewire-release-candidate.json"
          node scripts/release/dispatch-candidate.mjs "$CANDIDATE_FILE" "$EXPECTED_SHA" "$EXPECTED_VERSION" "$INVENTORY_SHA256"
          NPM_CLI="$(npm root --global)/npm/bin/npm-cli.js"
          node scripts/release/release.mjs candidate "$CANDIDATE_FILE" "$EXPECTED_SHA" "$EXPECTED_VERSION" "$INVENTORY_SHA256" .build/npm "$NPM_CLI"
  promote:
    if: inputs.operation == 'promote' && github.repository == 'winhok/SceneWireJS' && github.sha == inputs.expected_sha
    runs-on: ubuntu-24.04
    environment: npm-production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: |
          npm install --global npm@12.2.0 corepack@0.36.0
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build:cli
          pnpm package:check
          pnpm package:pack
      - name: Independently qualified stable promotion
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          INVENTORY_SHA256: ${{ inputs.inventory_sha256 }}
          CANDIDATE_JSON: ${{ inputs.candidate_json }}
        run: |
          CANDIDATE_FILE="$RUNNER_TEMP/scenewire-release-candidate.json"
          node scripts/release/dispatch-candidate.mjs "$CANDIDATE_FILE" "$EXPECTED_SHA" "$EXPECTED_VERSION" "$INVENTORY_SHA256"
          NPM_CLI="$(npm root --global)/npm/bin/npm-cli.js"
          node scripts/release/release.mjs promote "$CANDIDATE_FILE" "$EXPECTED_SHA" "$EXPECTED_VERSION" "$INVENTORY_SHA256" .build/npm "$NPM_CLI"
  recovery-verify:
    if: inputs.operation == 'recovery-promote' && github.repository == 'winhok/SceneWireJS' && github.sha == inputs.expected_sha && inputs.release_source_sha == '1e6e660829cb95c8c25f459ee7b2d193832a2709' && inputs.expected_version == '1.2.0'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: |
          npm install --global npm@12.2.0 corepack@0.36.0
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build:cli
          pnpm package:check
          pnpm package:pack
      - name: verify original source with exact recovery workflow binding
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_SOURCE_SHA: ${{ inputs.release_source_sha }}
          INVENTORY_SHA256: ${{ inputs.inventory_sha256 }}
          CANDIDATE_JSON: ${{ inputs.candidate_json }}
        run: |
          CANDIDATE_FILE="$RUNNER_TEMP/scenewire-release-candidate.json"
          node scripts/release/dispatch-candidate.mjs "$CANDIDATE_FILE" "$RELEASE_SOURCE_SHA" 1.2.0 "$INVENTORY_SHA256"
          NPM_CLI="$(npm root --global)/npm/bin/npm-cli.js"
          node scripts/release/recovery-promote.mjs verify "$CANDIDATE_FILE" "$EXPECTED_SHA" "$INVENTORY_SHA256" .build/npm "$NPM_CLI" recovery-verify.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: recovery-verify
          path: recovery-verify.json
          if-no-files-found: error
  recovery-promote:
    if: inputs.operation == 'recovery-promote' && github.repository == 'winhok/SceneWireJS' && github.sha == inputs.expected_sha && inputs.release_source_sha == '1e6e660829cb95c8c25f459ee7b2d193832a2709' && inputs.expected_version == '1.2.0'
    needs: recovery-verify
    environment: npm-production
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: |
          npm install --global npm@12.2.0 corepack@0.36.0
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build:cli
          pnpm package:check
          pnpm package:pack
      - name: promote original source with exact recovery workflow binding
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_SOURCE_SHA: ${{ inputs.release_source_sha }}
          INVENTORY_SHA256: ${{ inputs.inventory_sha256 }}
          CANDIDATE_JSON: ${{ inputs.candidate_json }}
        run: |
          CANDIDATE_FILE="$RUNNER_TEMP/scenewire-release-candidate.json"
          node scripts/release/dispatch-candidate.mjs "$CANDIDATE_FILE" "$RELEASE_SOURCE_SHA" 1.2.0 "$INVENTORY_SHA256"
          NPM_CLI="$(npm root --global)/npm/bin/npm-cli.js"
          node scripts/release/recovery-promote.mjs promote "$CANDIDATE_FILE" "$EXPECTED_SHA" "$INVENTORY_SHA256" .build/npm "$NPM_CLI" recovery-promote.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: recovery-promote
          path: recovery-promote.json
          if-no-files-found: error
