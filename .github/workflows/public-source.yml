name: Public source
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            node: 22.12.0
          - os: ubuntu-latest
            node: 22.12.0
          - os: windows-latest
            node: 22.12.0
          - os: ubuntu-latest
            node: 26.7.0
    runs-on: ${{ matrix.os }}
    env:
      NODE_PATH: ''
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 12.6.0
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm package:check
      - run: node apps/cli/dist/scenewire.js engines
      - name: Install renderer prerequisites
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22.12.0'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pnpm --filter @scenewirejs/renderer-web exec playwright install --with-deps chromium
      - name: Packed consumer and four installed engines
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22.12.0'
        run: pnpm package:smoke
